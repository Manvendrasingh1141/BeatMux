worker_processes auto;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Timeouts
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
    client_max_body_size 1M; # API bodies shouldn't be large, audio goes to cloudinary

    # Security Headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # ── Rate limiting ────────────────────────────────────────────────────────
    # General API zone — 50 requests/second per IP, shared memory 10 MB
    limit_req_zone $binary_remote_addr zone=api:10m  rate=50r/s;
    # Auth zone — stricter: 5 requests/minute per IP, shared memory 10 MB
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
    # Return 429 Too Many Requests when a zone limit is exceeded
    limit_req_status 429;

    # Websocket Support
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream syncwave_backend {
        server server1:3000;
        server server2:3000;
        server server3:3000;
    }

    server {
        listen 80;

        # Static Frontend
        location / {
            proxy_pass http://client;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Auth endpoints — tighter rate limit (5 req/min, burst of 5)
        location /api/auth {
            limit_req zone=auth burst=5 nodelay;

            proxy_pass http://syncwave_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # General API — 50 req/s with burst of 100
        location /api/ {
            limit_req zone=api burst=100 nodelay;

            proxy_pass http://syncwave_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws {
            proxy_pass http://syncwave_backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Don't buffer WS
            proxy_buffering off;
        }
        
        # Health checks for load balancer
        location /health/live {
            proxy_pass http://syncwave_backend/health/live;
        }

        location /health/ready {
            proxy_pass http://syncwave_backend/health/ready;
        }
    }
}
