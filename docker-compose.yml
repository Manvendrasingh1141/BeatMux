version: '3.8'

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
      - server3

  server1:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      - SERVER_INSTANCE_ID=server1
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/syncwave
      - REDIS_URL=redis://redis:6379
    expose:
      - "3000"
    depends_on:
      - mongodb
      - redis

  server2:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      - SERVER_INSTANCE_ID=server2
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/syncwave
      - REDIS_URL=redis://redis:6379
    expose:
      - "3000"
    depends_on:
      - mongodb
      - redis

  server3:
    build:
      context: ./server
    env_file:
      - ./server/.env
    environment:
      - SERVER_INSTANCE_ID=server3
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/syncwave
      - REDIS_URL=redis://redis:6379
    expose:
      - "3000"
    depends_on:
      - mongodb
      - redis

  client:
    build:
      context: ./client
    expose:
      - "80"

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  mongodb:
    image: mongo:8
    expose:
      - "27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
